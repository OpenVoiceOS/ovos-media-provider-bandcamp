[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media-provider-bandcamp"
dynamic = ["version"]
description = "OVOS MediaProvider plugin for Bandcamp (replaces ovos-skill-bandcamp)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.10"
keywords = ["ovos", "ocp", "media", "bandcamp", "mediaprovider", "plugin"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mediavocab>=1.0.0",
    "ovos-plugin-manager>=2.8.0a1,<3.0.0,<3.0.0",
    "py_bandcamp>=0.10.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.entry-points."opm.media.provider"]
bandcamp = "ovos_media_provider_bandcamp:BandcampMediaProvider"

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-media-provider-bandcamp"

[tool.setuptools.dynamic]
version = { attr = "ovos_media_provider_bandcamp.version.__version__" }

[tool.setuptools.packages.find]
include = ["ovos_media_provider_bandcamp*"]
